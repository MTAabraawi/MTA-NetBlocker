name: Build MTA Net blocker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        run: |
          ls -l gradlew gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.jar
          python3 - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar') as z:
              assert 'org/gradle/wrapper/GradleWrapperMain.class' in z.namelist()
          print('Gradle Wrapper JAR is valid.')
          PYTHON

      - name: Diagnose Gradle Wrapper
        run: |
          pwd
          ls -la
          ls -la gradle/wrapper
          file gradle/wrapper/gradle-wrapper.jar
          sha256sum gradle/wrapper/gradle-wrapper.jar
          grep -n 'CLASSPATH=' gradlew
          git status --short

      - name: Download Gradle 8.9
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Restore Firebase configuration
        env:
          FIREBASE_CONFIG_JSON_BASE64: ${{ secrets.FIREBASE_CONFIG_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_CONFIG_JSON_BASE64"
          printf '%s' "$FIREBASE_CONFIG_JSON_BASE64" | base64 --decode > app/google-services.json
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          data = json.loads(Path("app/google-services.json").read_text())
          packages = [
              item.get("package_name")
              for item in data.get("client", [])
              for item in [item.get("client_info", {}).get("android_client_info", {})]
          ]
          assert "com.mtaapps.testverify" in packages, "Firebase package mismatch"
          print("Firebase configuration validated.")
          PYTHON

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/mta-release.p12
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          test -s "$RELEASE_KEYSTORE_PATH"
          chmod 600 "$RELEASE_KEYSTORE_PATH"
          echo "Release keystore decoded successfully."

      - name: Build and test
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/mta-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: mtaRelease
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Net-blocker-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Net-blocker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

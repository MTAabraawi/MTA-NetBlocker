name: MTA Net blocker - Google Play Release

on:
  push:
    branches:
      - main
      - review/google-play-release-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mta-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify build configuration
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.mtaapps.testverify"' app/build.gradle.kts
          grep -Fq 'compileSdk = 36' app/build.gradle.kts
          grep -Fq 'targetSdk = 36' app/build.gradle.kts
          grep -Fq 'versionCode = 2' app/build.gradle.kts
          grep -Fq 'gradle-8.11.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          echo "Application configuration validated."

      - name: Verify Gradle Wrapper
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar
          python3 - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile("gradle/wrapper/gradle-wrapper.jar") as z:
              assert "org/gradle/wrapper/GradleWrapperMain.class" in z.namelist()
          print("Gradle Wrapper JAR is valid.")
          PYTHON

      - name: Restore Firebase configuration
        env:
          FIREBASE_CONFIG_JSON_BASE64: ${{ secrets.FIREBASE_CONFIG_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_CONFIG_JSON_BASE64"
          printf '%s' "$FIREBASE_CONFIG_JSON_BASE64" | base64 --decode > app/google-services.json
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          data = json.loads(Path("app/google-services.json").read_text())
          packages = [
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in data.get("client", [])
          ]
          assert "com.mtaapps.testverify" in packages, "Firebase package mismatch"
          print("Firebase configuration validated.")
          PYTHON

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/mta-release.p12
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          test -s "$RELEASE_KEYSTORE_PATH"
          chmod 600 "$RELEASE_KEYSTORE_PATH"
          echo "Release keystore decoded successfully."

      - name: Run tests and build APK and AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/mta-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: mtaRelease
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          bash ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest \
            assembleDebug \
            assembleRelease \
            bundleRelease

      - name: Verify release APK and AAB
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "package: name='com.mtaapps.testverify'" "$RUNNER_TEMP/apk-badging.txt"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB"

          echo "APK and AAB verification completed."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Net-blocker-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Net-blocker-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Net-blocker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

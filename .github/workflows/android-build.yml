name: Build MTA Net blocker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        run: |
          ls -l gradlew gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.jar
          python3 - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar') as z:
              assert 'org/gradle/wrapper/GradleWrapperMain.class' in z.namelist()
          print('Gradle Wrapper JAR is valid.')
          PYTHON

      - name: Diagnose Gradle Wrapper
        run: |
          pwd
          ls -la
          ls -la gradle/wrapper
          file gradle/wrapper/gradle-wrapper.jar
          sha256sum gradle/wrapper/gradle-wrapper.jar
          grep -n 'CLASSPATH=' gradlew
          git status --short

      - name: Download Gradle 8.9
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Build and test
        run: |
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MTA-Net-blocker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
